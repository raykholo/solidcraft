name: app binary
on: push
jobs:
  bin:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev libudev-dev libdbus-1-dev libgtk-3-dev libssl-dev
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: cargo build --profile ci -p solidcraft -p solidcraft-cli
      - uses: actions/upload-artifact@v4
        with:
          name: solidcraft-bin
          path: |
            target/ci/solidcraft
            target/ci/solidcraft-cli
          retention-days: 3
