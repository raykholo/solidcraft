# Checks for the plugins work on a personal fork, on GitHub's standard runners (the main CI
# workflow runs on runners only the project has). Runs only in the fork named below, so it does
# nothing in the project repository.
name: Fork CI

on:
  push:
    branches: [plugins-dutchman]
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Smaller test builds, so the runner's disk holds them.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  repository:
    name: Repository checks
    if: github.repository == 'raykholo/solidcraft'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fork-repo-checks
      - run: cargo fmt --all -- --check
      - run: cargo xtask assets
      - run: cargo xtask layers
      - run: cargo xtask ui-containers
      - run: cargo xtask lists
      - run: cargo xtask i18n --check

  plugins:
    name: Clippy and plugin tests
    if: github.repository == 'raykholo/solidcraft'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libudev-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fork-plugins
      - name: Clippy (engine, UI, CLI)
        run: cargo clippy -p solidcraft-engine -p solidcraft-ui-egui -p solidcraft-cli --all-targets -- -D warnings
      - name: Engine plugin and file tests
        run: 'cargo test -p solidcraft-engine --lib -- plugin:: cmd::file'
      # The skipped ribbon test fails on this branch's base commit too (an epaint texture-delta
      # assertion), not because of the plugins work.
      - name: UI plugin, dialog, toolbar and i18n tests
        run: 'cargo test -p solidcraft-ui-egui --lib -- plugins dialogs_plugin plugin_report toolbar workspace i18n icon_svg file_load agent_chat::gate control:: --skip persistent_grid_deferred_paint_retains_partial_and_offscreen_scroll_clips'

  wasm:
    name: Compile WebAssembly
    if: github.repository == 'raykholo/solidcraft'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fork-wasm
      - run: cargo xtask wasm
