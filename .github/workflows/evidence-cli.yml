name: Evidence CLI build
on:
  push:
    branches: ["fork-evidence/cli-build"]
jobs:
  build:
    strategy:
      matrix:
        ref: [kicad-embed-baseline, kicad-embedded-models]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
      - run: scripts/ci/build-jobs.sh
      - run: cargo build -p solidcraft-cli --profile ci --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-${{ matrix.ref }}
          path: target/ci/solidcraft-cli
