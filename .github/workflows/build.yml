name: L19769r-build
on:
  push:
    branches: ["L19769r-build"]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          repository: raykholo/solidcraft
          ref: dfc6b4e26c700ca61123d238f0838bab514aaec5
          fetch-depth: 1
      - name: Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config cmake build-essential libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers libvulkan1
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Build the desktop app
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_DEBUG: "false"
        run: cargo build --release -p solidcraft -p solidcraft-cli
      - name: Build the multi-file exporter plugin from the test fixture
        run: |
          curl -fsSL -o wt.tgz https://github.com/bytecodealliance/wasm-tools/releases/download/v1.254.0/wasm-tools-1.254.0-x86_64-linux.tar.gz
          tar xzf wt.tgz
          mkdir -p plug
          sed -e 's#__PACKAGE__#craft:plugin#g' -e 's#__VERSION__#0.2.0#g' crates/engine/src/plugin/exporter_fixture.wat > plug/exporter.wat
          wasm-tools-1.254.0-x86_64-linux/wasm-tools parse plug/exporter.wat -o plug/exporter.wasm
          cat > plug/plugin.json <<'JSON'
          {"id":"cutsheets","name":"Cut sheets","version":"1","capabilities":["formats@0.1"],"runtime":{"module":"exporter.wasm","commands":["document.inspect"],"entries":[{"name":"zip","kind":"exporter","extensions":["zip"],"label":"Cut sheets","output":"files"}],"limits":{"fuel":10000000,"memory_mib":2,"deadline_ms":5000}}}
          JSON
          cd plug && zip ../cutsheets.zip plugin.json exporter.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: cutsheets.zip
      - uses: actions/upload-artifact@v4
        with:
          name: solidcraft-app
          path: target/release/solidcraft
      - uses: actions/upload-artifact@v4
        with:
          name: solidcraft-cli
          path: target/release/solidcraft-cli
