name: reprocheck
on:
  push:
    branches: ["reprocheck/**"]
jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          path: ctl
      - name: Target commit
        run: echo "SHA=$(cat ctl/SHA)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: raykholo/solidcraft
          ref: ${{ env.SHA }}
          fetch-depth: 1
          path: src
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Build the CLI
        working-directory: src
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release -p solidcraft-cli --locked 2>&1 | tail -5
      - name: Evaluate the design
        run: |
          mkdir work && cp ctl/Mold.solidcraft work/ && cd work
          ../src/target/release/solidcraft-cli eval Mold.solidcraft 2>&1 | head -c 20000 || true
