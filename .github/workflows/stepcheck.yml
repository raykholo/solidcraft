name: stepcheck
on:
  push:
    branches: ["stepcheck/**"]
jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          path: ctl
      - name: Target commit
        run: echo "SHA=$(cat ctl/SHA)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: raykholo/solidcraft
          ref: ${{ env.SHA }}
          fetch-depth: 1
          path: src
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the CLI
        working-directory: src
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_DEBUG: "false"
        run: cargo build --release -p solidcraft-cli --locked
      - name: Evaluate the files
        run: |
          for f in ctl/files/*.step; do
            echo "== $f"
            src/target/release/solidcraft-cli eval "$f" > out.json 2> err.txt || true
            python3 -c "import json;d=json.load(open('out.json'));[print('RESULT', '$f', 'area', b.get('area_mm2'), 'volume', b.get('volume_mm3'), 'faces', b.get('faces')) for b in d.get('bodies',[])]" || cat out.json | head -c 2000
            grep -i -E "turned over|loop nesting|warning" out.json err.txt | head -5 || true
          done
