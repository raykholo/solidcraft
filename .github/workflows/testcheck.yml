name: testcheck
on:
  push:
    branches: ["testcheck/**"]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SOLIDCRAFT_GPU: software
      VIEWPORT_TEST_GPU: software
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: ctl
      - name: Target commit
        run: echo "SHA=$(cat ctl/SHA)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: raykholo/solidcraft
          ref: ${{ env.SHA }}
          fetch-depth: 1
          path: src
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Graphics for the window tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mesa-vulkan-drivers libvulkan1 > /dev/null
      - name: Run the named tests
        working-directory: src
        run: |
          # ctl/TESTS: one line per run, "<package> <test name filter>"; output is printed in full.
          # ctl/PROFILE: cargo profile, "ci" (default, as real CI: no debug assertions) or "dev".
          profile=$(cat ../ctl/PROFILE 2>/dev/null || echo ci)
          if [ "$profile" = ci ] && ! grep -q '^\[profile\.ci\]' Cargo.toml; then
            echo "this commit has no [profile.ci]; using dev"; profile=dev
          fi
          status=0
          while read -r pkg filter; do
            [ -z "$pkg" ] && continue
            echo "=== TEST $pkg $filter (profile $profile)"
            set -o pipefail
            cargo test --profile "$profile" -p "$pkg" --lib --tests -- "$filter" --nocapture --test-threads=1 2>&1 | { grep -v "^\s*Compiling\|^\s*Downloaded\|^\s*Downloading" || true; } || status=1
            set +o pipefail
          done < ../ctl/TESTS
          exit $status
