[package]
name = "solidcraft-dutchman-convert"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.54"
# Dutchman with `dutchman_core::read_bytes` (a design from its contents alone, no file system).
dutchman-core = { git = "https://github.com/dutchman-cad/dutchman", rev = "fda0d7bd297c44e670ad4870fde2ec795f0a7159" }
dutchman-solidcraft = { git = "https://github.com/dutchman-cad/dutchman", rev = "fda0d7bd297c44e670ad4870fde2ec795f0a7159" }

# No LTO: linking every decoder with fat or thin LTO needs more than 12 GiB of memory. The
# linker still drops unused code.
[profile.release]
opt-level = "z"
codegen-units = 16
lto = false
strip = true
debug = 0

# cadmpeg main (12e6614c29254c7a426fbdf037c0e6e3002bddc9), which carries the wasm32 fix for Fusion parameter scopes (#645).
# Dutchman's own pin is left as it is; this example builds against the newer decoder.
[patch."https://github.com/raykholo/cadmpeg"]
cadmpeg-core = { git = "https://github.com/cadmpeg/cadmpeg", rev = "12e6614c29254c7a426fbdf037c0e6e3002bddc9" }
cadmpeg-ir = { git = "https://github.com/cadmpeg/cadmpeg", rev = "12e6614c29254c7a426fbdf037c0e6e3002bddc9" }
cadmpeg-registry = { git = "https://github.com/cadmpeg/cadmpeg", rev = "12e6614c29254c7a426fbdf037c0e6e3002bddc9" }
cadmpeg-codec-f3d = { git = "https://github.com/cadmpeg/cadmpeg", rev = "12e6614c29254c7a426fbdf037c0e6e3002bddc9" }
