[package]
name = "solidcraft-dutchman-convert"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
# Dutchman main: a Cargo feature per input format (so only the codecs of the formats this
# importer claims are linked), and assembly parts that keep an unchecked history hidden.
dutchman-core = { git = "https://github.com/dutchman-cad/dutchman", rev = "ce45c1ea3daba7263991612031ec326e17ea80bf", default-features = false, features = ["fusion", "inventor", "solidworks", "freecad"] }
dutchman-solidcraft = { git = "https://github.com/dutchman-cad/dutchman", rev = "ce45c1ea3daba7263991612031ec326e17ea80bf" }

# The desktop build's WIT bindings.
[target.'cfg(all(target_os = "wasi", target_env = "p2"))'.dependencies]
wit-bindgen = "0.54"

# Smallest component: optimise for size, one code unit and thin LTO (39.7 MB; with every
# cadmpeg codec and no LTO it was 68.7 MB). Wasm has no unwinding, so panics abort already.
[profile.release]
opt-level = "z"
codegen-units = 1
lto = "thin"
strip = true
debug = 0

# Fixed "random" bytes (see fixed-random/src/lib.rs), the same in both builds: one file converts
# the same way every time.
[patch.crates-io]
getrandom = { path = "fixed-random" }
