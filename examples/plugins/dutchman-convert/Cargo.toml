[package]
name = "solidcraft-dutchman-convert"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.54"
# Dutchman with `dutchman_core::read_bytes` (a design from its contents alone, no file system).
dutchman-core = { git = "https://github.com/dutchman-cad/dutchman", rev = "18b909dd02ba9847113334b231f0d1ccd39aa775" }
dutchman-solidcraft = { git = "https://github.com/dutchman-cad/dutchman", rev = "18b909dd02ba9847113334b231f0d1ccd39aa775" }

# No LTO: linking every decoder with fat or thin LTO needs more than 12 GiB of memory. The
# linker still drops unused code.
[profile.release]
opt-level = "z"
codegen-units = 16
lto = false
strip = true
debug = 0
