[package]
name = "solidcraft-dutchman-convert"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.54"
serde_json = "1"
# Dutchman's `solidcraft-plugin-pin` branch: main with a Cargo feature per input format (so
# only the codecs of the formats this importer claims are linked) and assembly parts that keep
# an unchecked history hidden.
dutchman-core = { git = "https://github.com/dutchman-cad/dutchman", rev = "8e03f84806b22a905c8515145a4ae03936127a05", default-features = false, features = ["fusion", "inventor", "solidworks", "freecad"] }
dutchman-solidcraft = { git = "https://github.com/dutchman-cad/dutchman", rev = "8e03f84806b22a905c8515145a4ae03936127a05" }

# Smallest component: optimise for size, one code unit and thin LTO (39.7 MB; with every
# cadmpeg codec and no LTO it was 68.7 MB). Wasm has no unwinding, so panics abort already.
[profile.release]
opt-level = "z"
codegen-units = 1
lto = "thin"
strip = true
debug = 0
