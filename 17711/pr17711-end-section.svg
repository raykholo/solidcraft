<text x="40.0" y="42.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">Where a round's end section starts: the rail's crossing of the end face's plane</text>
<text x="40.0" y="70.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#000000">A rail that crosses no side edge overflows its end face only where that crossing lies past the side edge's far end P.</text>
<text x="40.0" y="115.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">A. #17710, looking along the axis: the exact round's rail runs on round it</text>
