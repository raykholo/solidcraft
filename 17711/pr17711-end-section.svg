<text x="1204.5" y="385.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000">(23, 9): past P</text>
<text x="700.0" y="520.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000">Plane square to the edge: (20, 9) projects 2.12 along the side, which is 2.83 long.</text>
<text x="700.0" y="540.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000">End face's plane: (23, 9) projects 4.24: the end section starts past P, under the</text>
<text x="700.0" y="556.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000">lower step. It is an overflow, cut by that plane. The end face's plane is the one used.</text>
<text x="40.0" y="690.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000">In A the end plane holds the axis, so the end face's plane and the plane square to the edge coincide; in B they differ.</text>
</svg>
